 mesh(g,new T.CylinderGeometry(.99,.95,.09,128,1,true).rotateX(Math.PI/2),polM,0,0,.055)});
part([0,0,3.5],[0,0,.42],g=>{[22.5,67.5,112.5,157.5,-22.5,-67.5,-112.5,-157.5].forEach((d,k)=>{const a=d*Math.PI/180,x=Math.sin(a)*1.07,y=Math.cos(a)*1.07;
 mesh(g,cyl(.058,.058,.035,32),polM,x,y,0);mesh(g,new T.BoxGeometry(.095,.015,.012),darkM,x,y,.02).rotation.z=-a+[.5,-.4,.9,.2,1.4,.7,-.9,.1][k]})});

/* Coroa serrilhada com disco RFS */
const rfsT=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#17181b';x.fillRect(0,0,128,128);x.fillStyle='#d9dce2';x.font='italic 700 46px Helvetica,Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('RFS',64,66);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;return t})();
const rfsM=PM({map:rfsT,roughness:.3,metalness:.5});
part([1.9,0,0],[1.43,0,0],g=>{const cg=new T.CylinderGeometry(.2,.2,.26,48,1);const pa=cg.attributes.position;for(let i=0;i<pa.count;i++){const x=pa.getX(i),z=pa.getZ(i),k=Math.round(Math.atan2(z,x)/TAU*48);const f=k%2?.93:1;pa.setX(i,x*f);pa.setZ(i,z*f)}cg.computeVertexNormals();cg.rotateZ(Math.PI/2);
 mesh(g,cg,steelM);mesh(g,new T.CylinderGeometry(.17,.17,.04,48).rotateZ(Math.PI/2),polM,.14,0,0);mesh(g,new T.CylinderGeometry(.21,.21,.03,48).rotateZ(Math.PI/2),polM,-.12,0,0);
 mesh(g,new T.CircleGeometry(.15,48).rotateY(Math.PI/2),rfsM,.162,0,0)});

/* Pulseira integrada: fileiras de elos (placa central polida + blocos laterais escovados) que se enrolam em laço, com fecho */
const bez=(P,u)=>{const v=1-u,a=v*v*v,b=3*v*v*u,c=3*v*u*u,d=u*u*u;return[a*P[0][0]+b*P[1][0]+c*P[2][0]+d*P[3][0],a*P[0][1]+b*P[1][1]+c*P[2][1]+d*P[3][1]]};
const BZ=[[1.64,-.02],[2.6,-.05],[1.6,-2.3],[0,-2.3]],SMP=[[0,0]];{let pv=bez(BZ,0),ln=0;for(let i=1;i<=400;i++){const p=bez(BZ,i/400);ln+=Math.hypot(p[0]-pv[0],p[1]-pv[1]);SMP.push([i/400,ln]);pv=p}}
const LEN=SMP[400][1],NL=Math.round(LEN/.2)-1,PITCH=LEN/NL,NT=NL+Math.ceil(6/PITCH);
const uAt=s=>{s=Math.max(0,Math.min(LEN,s));let lo=0,hi=400;while(hi-lo>1){const m=(lo+hi)>>1;SMP[m][1]<s?lo=m:hi=m}const a=SMP[lo],b=SMP[hi];return lerp(a[0],b[0],(s-a[1])/Math.max(1e-6,b[1]-a[1]))};
const pp=(s,k)=>{const l=bez(BZ,uAt(s));return[lerp(1.64+s,l[0],k),lerp(-.02,l[1],k)]};
const fr=(s,k,sg)=>{const p=pp(s,k),a=pp(s-.02,k),c=pp(s+.02,k);let ty=c[0]-a[0],tz=c[1]-a[1],y=p[0];const l=Math.hypot(ty,tz)||1;ty/=l;tz/=l;if(sg<0){y=-y;ty=-ty}return{y,z:p[1],ty,tz}};
const bs=f=>new T.Matrix4().makeBasis(new T.Vector3(1,0,0),new T.Vector3(0,f.ty,f.tz),new T.Vector3(0,-f.tz,f.ty)).setPosition(0,f.y,f.z);
const slabG=ext(rr(.745,.175,.045),.08,.02,2),sideG=ext(rr(.2,.185,.03),.07,.018,2),braces=[];
const trEdges=(geo,mats)=>{const src=new T.EdgesGeometry(geo,12).attributes.position.array,out=new Float32Array(src.length*mats.length),v=new T.Vector3();mats.forEach((m,j)=>{for(let i=0;i<src.length;i+=3){v.set(src[i],src[i+1],src[i+2]).applyMatrix4(m);out.set([v.x,v.y,v.z],j*src.length+i)}});const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(out,3));return new T.LineSegments(g,wireM)};
const Bs=new T.Matrix4(),Bt=new T.Matrix4();
function lay(b,k,wires){const slab=b.slab,side=b.side,ms=[],mx=[];
 for(let i=0;i<NT;i++){const s=(i+.5)*PITCH,vis=i<NL?1:1-ss(0,.45,k),f=(1-.2*Math.min(1,s/LEN))*vis,base=bs(fr(s,k,b.sg));
  const m0=base.clone().multiply(Bs.makeScale(f,vis,vis));slab.setMatrixAt(i,m0);ms.push(m0);
  [-1,1].forEach((q,j)=>{const m1=base.clone().multiply(Bt.makeTranslation(q*(.745*f/2+.1*f+.012),0,0)).multiply(Bs.makeScale(f,vis,vis));side.setMatrixAt(i*2+j,m1);mx.push(m1)})}
 slab.instanceMatrix.needsUpdate=side.instanceMatrix.needsUpdate=true;
 if(wires){b.g.add(trEdges(slabG,ms));b.g.add(trEdges(sideG,mx))}
 const cv=ss(.55,.85,k)+1e-4;[[b.plate,LEN-.2],[b.cover,LEN]].forEach(([o,s])=>{if(!o)return;const f=fr(s,k,b.sg);o.position.set(0,f.y,f.z);o.quaternion.setFromRotationMatrix(bs(f));o.scale.setScalar(cv)})}
[1,-1].forEach(sg=>{const b={sg};b.g=part([0,sg*.8,0],[0,0,0],g=>{b.slab=new T.InstancedMesh(slabG,polM,NT);b.side=new T.InstancedMesh(sideG,steelM,NT*2);[b.slab,b.side].forEach(m=>{m.castShadow=true;m.receiveShadow=true;m.frustumCulled=false;cast.push(m);g.add(m)});
 b.plate=mesh(g,ext(rr(.95,.4,.08),.1,.025,2),steelM);
 if(sg>0){b.cover=mesh(g,ext(rr(1.12,.8,.12),.12,.03,2).translate(0,0,.07),polM);mesh(b.cover,cyl(.07,.07,.05,24),steelM,0,.27,.16);[-1,1].forEach(q=>mesh(b.cover,new T.CylinderGeometry(.035,.035,.78,20),polM,q*.575,0,.07))}});
 braces.push(b);lay(b,0,true)});
let lastK=0;

/* Halo técnico da imagem de marketing: anéis, régua de marcas e parafusos orbitando */
const halo=new T.Group();halo.position.y=3.1;scene.add(halo);
const ringM=new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0});
[[3.5,.9,.2],[4.1,1.2,-.5],[4.8,.6,.9]].forEach(r=>{const p=[];for(let i=0;i<=200;i++){const a=i/200*TAU;p.push(new T.Vector3(Math.cos(a)*r[0],Math.sin(a)*r[0],0))}const l=new T.LineLoop(new T.BufferGeometry().setFromPoints(p),ringM);l.rotation.set(r[1],r[2],0);halo.add(l)});
{const p=[];for(let i=0;i<180;i++){const a=i/180*TAU,r=i%5?5.05:5.2;p.push(new T.Vector3(Math.cos(a)*4.95,Math.sin(a)*4.95,0),new T.Vector3(Math.cos(a)*r,Math.sin(a)*r,0))}const t=new T.LineSegments(new T.BufferGeometry().setFromPoints(p),ringM);t.rotation.set(1.25,.2,0);halo.add(t)}
const orb=[];for(let i=0;i<3;i++){const g=new T.Group();g.add(new T.Mesh(cyl(.07,.07,.05,24).rotateX(.4*i),polM));const sl=new T.Mesh(new T.BoxGeometry(.1,.018,.012),darkM);sl.position.z=.03;g.add(sl);g.userData={r:3.4+i*.55,s:.25+.1*i,o:i*2.1};halo.add(g);orb.push(g)}

/* Chão espelhado: cópia invertida do relógio abaixo do piso, vista através de um piso escuro translúcido */
const mirror=new T.Group();mirror.scale.y=-1;mirror.position.y=2;scene.add(mirror);const rig2=rig.clone(true);mirror.add(rig2);
const TA=[],TB=[];rig.traverse(o=>TA.push(o));rig2.traverse(o=>TB.push(o));
TA.forEach((o,i)=>{if(o.isInstancedMesh)TB[i].instanceMatrix=o.instanceMatrix;if(TB[i].isMesh){TB[i].castShadow=false;TB[i].receiveShadow=false}});
const syncMirror=()=>{for(let i=0;i<TA.length;i++){const a=TA[i],b=TB[i];b.position.copy(a.position);b.quaternion.copy(a.quaternion);b.scale.copy(a.scale);b.visible=a.visible}};
const gcv=document.createElement('canvas');gcv.width=gcv.height=256;{const x=gcv.getContext('2d'),g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(8,8,10,.52)');g.addColorStop(.55,'rgba(8,8,10,.46)');g.addColorStop(1,'rgba(8,8,10,0)');x.fillStyle=g;x.fillRect(0,0,256,256)}
const gloss=new T.Mesh(new T.PlaneGeometry(28,28),new T.MeshBasicMaterial({map:new T.CanvasTexture(gcv),transparent:true,opacity:0,depthWrite:false}));gloss.rotation.x=-Math.PI/2;gloss.position.y=1.01;gloss.renderOrder=3;scene.add(gloss);

/* Acabamentos da caixa e da pulseira */
const tc=col(F[0][2]),tp=new T.Color(),WH=new T.Color(1,1,1);let tgt=F[0],mx=0,my=0,t=0,cu=0,lastCast=null;tp.copy(tc).lerp(WH,.25);
const swn=$('#swn'),sw=[...document.querySelectorAll('#sw button')],stage=$('.stage');
const pick=i=>{tgt=F[i];tc.copy(col(tgt[2]));tp.copy(tc).lerp(WH,.25);sw.forEach((b,k)=>b.classList.toggle('on',k===i));swn.innerHTML=L(tgt[0],tgt[1])};
sw.forEach(b=>b.onclick=()=>pick(+b.dataset.i));pick(0);
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const rs=()=>{const w=innerWidth,h=innerHeight,as=w/h;renderer.setSize(w,h,false);camera.aspect=as;if(as>1.2)camera.setViewOffset(w,h,-w*.17,0,w,h);else if(as<.9)camera.setViewOffset(w,h,0,h*.12,w,h);else camera.clearViewOffset();camera.updateProjectionMatrix()};addEventListener('resize',rs);rs();

let fpsT=performance.now(),fpsN=0,lite=false;
function loop(){t+=.016;if(++fpsN===90){const now=performance.now(),avg=(now-fpsT)/90;fpsT=now;fpsN=0;if(avg>42&&renderer.getPixelRatio()>1){renderer.setPixelRatio(1);rs()}else if(avg>55&&!lite){lite=true}}const raw=scrollY/Math.max(1,rng()),f=Math.max(0,Math.min(1,raw)),u=f<=.5?f*1.1:.55+(f-.5)*.84;cu+=(u-cu)*.08;
 let i=0;TH.forEach((v,k)=>{if(u>=v)i=k});setAct(i);
 const solid=ss(.32,.45,cu),wire=1-ss(.4,.6,cu),ex=ss(.38,.5,cu)-ss(.58,.7,cu),fin=ss(.72,.95,cu);
 document.documentElement.classList.toggle('fin',fin>.5&&raw<1.02);
 steelM.color.lerp(tc,.1);polM.color.lerp(tp,.1);steelM.roughness+=(tgt[3]-steelM.roughness)*.1;polM.roughness=steelM.roughness*.16;
 MS.forEach(m=>{m.opacity=solid*m.userData.base;m.transparent=solid<.99||m.userData.base<1});wireM.opacity=wire;wireM.visible=wire>.01;
 const cs=solid>.4;if(cs!==lastCast){lastCast=cs;cast.forEach(o=>o.castShadow=cs)}
 parts.forEach(g=>{const d=g.userData;g.position.set(d.rest[0]+d.off[0]*ex,d.rest[1]+d.off[1]*ex,d.rest[2]+d.off[2]*ex)});
 if(Math.abs(fin-lastK)>.002){lastK=fin;braces.forEach(b=>lay(b,fin,false))}
 /* Ponteiros com a hora local do visitante */
 const n=new Date(),s=n.getSeconds()+n.getMilliseconds()/1000,mi=n.getMinutes()+s/60,h=n.getHours()%12+mi/60,h24=n.getHours()+mi/60;
 hH.rotation.z=-h/12*TAU;hM.rotation.z=-mi/60*TAU;hS.rotation.z=-s/60*TAU;hD.rotation.z=-h24/24*TAU;cage.rotation.z=-s/60*TAU;
 /* Pose isométrica da imagem de marketing e flutuação */
 rig.rotation.set(-.18*fin,-.5*fin+Math.sin(t*.45)*.1*fin,-.28*fin);rig.position.y=3.1+.2*fin+Math.sin(t*.7)*.07*fin;const fm=ss(.82,1,fin);mirror.visible=gloss.visible=fm>.01&&!lite;gloss.material.opacity=fm;syncMirror();
 halo.visible=fin>.02;ringM.opacity=.32*fin;halo.rotation.y=t*.05;halo.rotation.z=t*.03;
 orb.forEach(o=>{const d=o.userData,a=t*d.s+d.o;o.position.set(Math.cos(a)*d.r,Math.sin(a*1.3)*1.6,Math.sin(a)*d.r*.7);o.rotation.set(a,a*.7,0)});
 const as=camera.aspect,a=.3+ex+.35*ss(.4,.62,cu)-.45*fin+mx*.4;let r=12.5+3*ex-1.9*fin;r=Math.max(r,(4.3+1.6*fin+2.2*ex)/(.573*as));
 camera.position.set(Math.sin(a)*r,3.6+fin*1.3+my*.8,Math.cos(a)*r);camera.lookAt(0,3.1-fin*.1,0);
 renderer.render(scene,camera);requestAnimationFrame(loop)}
loop();
})();
